[project]
name = "superjoin-processing"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.126.0",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.4",
  "torch==2.14.0",
  "torchvision==0.29.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "jsonschema==4.26.0", "pyyaml==6.0.3"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["docling: real PDF conversion (may download model assets)"]
